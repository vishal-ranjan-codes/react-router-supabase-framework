name: CI

# The branch is `master`; the original workflow only watched `main`, so it never ran.
# Both are listed so a rename to `main` later keeps CI alive.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + unit + build + ds (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: npm
            install: npm ci
            script: npm run
          - pm: pnpm
            install: pnpm install --frozen-lockfile
            script: pnpm
    steps:
      - uses: actions/checkout@v4

      # Only meaningful for the pnpm leg: the repo deliberately has no `packageManager`
      # field, so neither package manager is forced on the other.
      - name: Install pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ matrix.pm }}

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Lint
        run: ${{ matrix.script }} lint

      - name: Format check
        run: ${{ matrix.script }} format:check

      # Generates worker-configuration.d.ts + route types, then type-checks every project.
      - name: Typecheck
        run: ${{ matrix.script }} typecheck

      - name: Unit tests
        run: ${{ matrix.script }} test

      - name: Build
        run: ${{ matrix.script }} build

      # Rule 5 asserts against the shipped stylesheet, so this has to run after Build.
      - name: Design-system guardrails
        run: ${{ matrix.script }} check:ds

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The job only asks Playwright for chromium, and playwright.config.ts only declares
      # the chromium project under CI, so the two stay in step.
      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # `--project=chromium` is not a preference: the committed screenshot baselines were
      # rendered on `windows-latest`, and `snapshotPathTemplate` keys them by `{platform}`,
      # so this runner must not ask for the `visual` project. It would fail on a missing
      # snapshot rather than on a real visual regression.
      - name: Run e2e tests
        run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Font rasterisation is platform-specific, so the pixel suite runs where the baselines
  # were made. Windows runners cost more than Linux; the alternative is a set of snapshots
  # nothing ever compares against.
  visual:
    name: visual regression (windows chromium)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--with-deps` is Linux-only; on Windows the browser binary needs nothing else.
      - name: Install browsers
        run: npx playwright install chromium

      - name: Run visual specs
        run: npm run test:e2e -- --project=visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 7
